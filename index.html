<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Stats-preview-card-component</title>
  </head>
  <body>
    <main>
      <div class="main_container">
        <div class="content_card_one">
          <div class="content">
            <div class="info">
              <h1 class="main_heading">
                Get <span>insights</span> that help your business grow.
              </h1>
              <p class="main_para">
                Discover the benefits of data analytics and make better
                decisions regarding revenue, customer experience, and overall
                efficiency.
              </p>
            </div>
            <div class="count">
              <div class="companies">
                <h1 class="stats">10k+</h1>
                <p class="para">COMPANIES</p>
              </div>
              <div class="templates">
                <h1 class="stats">314</h1>
                <p class="para">TEMPLATES</p>
              </div>
              <div class="queries">
                <h1 class="stats">12M+</h1>
                <p class="para">QUERIES</p>
              </div>
            </div>
          </div>
        </div>
        <div class="content_card_two"></div>
      </div>
    </main>
  </body>
</html>
